# `version` is no longer needed in compose files v3+

services:
  api:
    build: .
    container_name: iot_microclimate_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy   # wait until the database healthcheck passes
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: timescale/timescaledb:latest-pg15
    container_name: iot_microclimate_db
    environment:
      POSTGRES_USER: telemetry_user
      POSTGRES_PASSWORD: 123456789TELEMETRY
      POSTGRES_DB: telemetry_user   # create a database matching the user
    ports:
      - "5432:5432"
    healthcheck:
      # specify database name too so pg_isready doesn't try to connect
      # to the default `telemetry_user` database (otherwise you'll see
      # FATAL logs when the DB doesn't exist yet).
      test: ["CMD-SHELL","pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 5
